# Vesper viewer + websocket proxy. Installed by setup.sh as /etc/nginx/sites-available/vesper.
# The web export is single-threaded so COOP/COEP are not strictly required; they are sent anyway
# (harmless, and they let a threaded export work later).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /opt/vesper/build/web;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types application/wasm application/javascript text/css application/json text/plain text/markdown;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # the world server (WebSocket)
    location /ws {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # the newspaper and the ledger, readable in the open
    location /journal/ {
        alias /opt/vesper/journal/;
        autoindex on;
        autoindex_format json;
        default_type text/plain;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
    location /ledger/ {
        alias /opt/vesper/ledger/;
        autoindex on;
        default_type text/plain;
    }
    location = /checkpoint.json {
        alias /opt/vesper/checkpoints/latest.json;
        default_type application/json;
    }
}
